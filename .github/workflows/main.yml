
name: Boletim B4 Bot

on:
  schedule:
    # Roda todos os dias de semana (segunda a sexta) às 20:23 UTC (17:23 Horário de Brasília)
    - cron: '23 20 * * 1-5'
  workflow_dispatch:
    # Permite rodar o robô manualmente clicando em um botão no GitHub

jobs:
  publish-boletim:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar Dependências
        run: |
          cd bot_boletim
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Executar Automação Diária
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: |
          cd bot_boletim
          python main.py
