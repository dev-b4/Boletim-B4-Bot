name: Boletim B4 Bot 2.0 (Blindado)

on:
  schedule:
    # Passo 1: Gera e Envia Email às 16:00 BRT (19:00 UTC) de Seg a Sex
    - cron: '00 19 * * 1-5'
    # Passo 2: Checa aprovação a cada 10 min, das 16:10 às 17:30 BRT (19:10-20:30 UTC)
    - cron: '10,20,30,40,50 19 * * 1-5'
    - cron: '00,10,20,30 20 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar Dependências
        run: |
          cd bot_boletim
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Executar Lógica de Horário
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          cd bot_boletim
          
          # Descobre que horas são (UTC)
          HOUR=$(date -u +"%H")
          MINUTE=$(date -u +"%M")
          
          # Se for 19:00 (16h00 BRT), roda o gerador
          if [ "$HOUR" = "19" ] && [ "$MINUTE" = "00" ]; then
            echo "Rodando Geração (16h00)"
            python generate_draft.py
          else
            echo "Rodando Checagem de Aprovação"
            python check_approval.py
          fi
